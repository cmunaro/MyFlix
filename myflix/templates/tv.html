<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ session.csrf }}">
  <title>{% block title %}MyFlix{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='tv.css', v='title-details-1') }}">
  <script src="{{ url_for('static', filename='tv.js', v='desktop-arrows-1') }}" defer></script>
  {% block scripts %}{% endblock %}
</head>
<body class="{% block body_class %}tv-browse{% endblock %}">
  {% block header %}
  <header class="tv-header">
    <a class="wordmark" href="/" aria-label="MyFlix home">MYFLIX</a>
    <a class="search-toggle" href="/?search=1" aria-label="Search library">⌕</a>
    <a class="profile" href="/admin" aria-label="Manage library">M</a>
  </header>
  {% endblock %}
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
