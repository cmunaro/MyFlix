<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ session.csrf }}">
  <title>{% block title %}MyFlix{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='tv.css', v='home-layout-2') }}">
  <script src="{{ url_for('static', filename='tv.js', v='home-focus-2') }}" defer></script>
  {% block scripts %}{% endblock %}
</head>
<body class="{% block body_class %}tv-browse{% endblock %}">
  {% block header %}
  <header class="tv-header">
    <a class="wordmark" href="/" aria-label="MyFlix home">MYFLIX</a>
    <a class="search-toggle" href="/?search=1" aria-label="Search library">⌕</a>
    {% if request.endpoint == 'home' %}
    <button id="notification-toggle" class="notification-toggle" type="button" aria-label="Notifications" aria-expanded="false" aria-controls="notifications">
      <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="notification-count" class="notification-count" hidden></span>
    </button>
    <section id="notifications" class="notifications" aria-label="Notifications" hidden>
      <h2>Notifications</h2>
      <div id="notification-list" class="notification-list" tabindex="0" aria-live="polite"><p>Loading notifications…</p></div>
    </section>
    {% endif %}
    <a class="profile" href="/admin" aria-label="Manage library">M</a>
  </header>
  {% endblock %}
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
